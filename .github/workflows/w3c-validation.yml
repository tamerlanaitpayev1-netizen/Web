name: W3C Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Nu Html Checker
        run: npm install --no-save vnu-jar@26.8.30

      - name: Validate HTML and CSS
        run: |
          mkdir -p validation
          set +e
          npx vnu --format json index.html about.html contact.html css/style.css > validation/w3c-results.json 2> validation/w3c-errors.txt
          status=$?
          cat validation/w3c-results.json
          cat validation/w3c-errors.txt
          echo $status > validation/exit-code.txt
          exit 0

      - name: Build validation evidence page
        run: |
          node <<'NODE'
          const fs = require('fs');
          let raw = fs.readFileSync('validation/w3c-results.json','utf8').trim();
          let data;
          try { data = JSON.parse(raw); } catch { data = null; }
          const msgs = data?.messages || [];
          const errors = msgs.filter(m => m.type === 'error');
          const warnings = msgs.filter(m => m.type !== 'error');
          const files = [...new Set(msgs.map(m => m.url || m.document || ''))].filter(Boolean);
          const status = errors.length === 0 ? 'VALID' : 'ISSUES FOUND';
          const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
          const rows = msgs.map(m => '<tr><td>'+esc(m.type)+'</td><td>'+esc(m.url || '')+'</td><td>'+esc(m.lastLine || '')+'</td><td>'+esc(m.message)+'</td></tr>').join('');
          fs.writeFileSync('validation/index.html', '<!doctype html><meta charset="utf-8"><title>W3C Validation Evidence</title><style>body{font-family:Arial,sans-serif;background:#050505;color:#fff;padding:40px}h1{color:#d71920}table{border-collapse:collapse;width:100%}th,td{border:1px solid #444;padding:10px;text-align:left}th{background:#d71920}.ok{font-size:32px;color:#d71920}.muted{color:#bbb}</style><h1>W3C / Nu Html Checker Evidence</h1><div class="ok">'+status+'</div><p class="muted">Files checked: '+esc(files.join(', '))+'</p><p>Errors: '+errors.length+' · Warnings: '+warnings.length+'</p>'+ (msgs.length ? '<table><thead><tr><th>Type</th><th>File</th><th>Line</th><th>Message</th></tr></thead><tbody>'+rows+'</tbody></table>' : '<h2>No messages reported.</h2>'));
          NODE

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Screenshot validation evidence
        run: |
          npx playwright screenshot --device="Desktop Chrome" --full-page file://$GITHUB_WORKSPACE/validation/index.html validation/w3c-validation.png

      - name: Commit validation evidence to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/w3c-results.json validation/w3c-errors.txt validation/w3c-validation.png
          git diff --cached --quiet && exit 0
          git commit -m "Add W3C validation evidence"
          git push
